<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8"><title>Сетліст</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#000;--card:#111114;--c2:#1b1b20;--tx:#f4f4f5;--mu:#8b8b94;--ac:#8b5cf6;--ac2:#c4b5fd;--bd:#26262c;--ch:#a78bfa}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,'Inter','Segoe UI',Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 60px}
input,textarea,select,button{font:inherit;color:inherit}
.eyebrow{color:var(--ac2);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.t{background:none;border:0;outline:0;width:100%;padding:0}
#title{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:6px}#date{color:var(--mu);margin-top:2px}
.bar{display:flex;justify-content:space-between;align-items:center;margin:22px 0 12px;color:var(--mu);font-size:14px}
button{background:var(--c2);border:1px solid var(--bd);border-radius:12px;padding:8px 14px;cursor:pointer;min-height:40px}
button:active{transform:scale(.97)}button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
button.x{color:#f87171;background:none}
.song{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 12px 12px 8px;margin-bottom:8px;user-select:none}
.song{transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .2s,border-color .2s;will-change:transform}
.song.drag{transition:box-shadow .2s,border-color .2s;border-color:var(--ac);box-shadow:0 14px 40px #8b5cf666;background:var(--c2);position:relative;z-index:5}
#app>*{animation:in .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.song:active:not(.drag){background:var(--c2)}
.h{touch-action:none;cursor:grab;color:var(--mu);font-size:20px;padding:8px 6px;line-height:1}
.n{color:var(--mu);font-weight:700;width:18px;text-align:center;font-variant-numeric:tabular-nums}
.sb{flex:1;min-width:0;cursor:pointer}.sn{font-weight:650;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:13px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--c2);white-space:nowrap}
.pill.k{background:#8b5cf622;color:var(--ac2)}
.back{background:none;border:0;color:var(--ac2);padding:0;min-height:0;margin-bottom:14px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-top:12px}
label{display:block;color:var(--mu);font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.r{display:flex;align-items:center;gap:10px}.big{font-size:44px;font-weight:800;letter-spacing:-.03em;min-width:80px;text-align:center}
select,textarea{width:100%;background:var(--c2);border:1px solid var(--bd);border-radius:12px;padding:10px}
.step{width:44px;padding:0;font-size:20px}textarea{min-height:200px;font:14px/1.5 ui-monospace,Menlo,monospace}
pre{font:15px/1.55 ui-monospace,Menlo,monospace;white-space:pre-wrap;margin:0;overflow-x:auto}.ch{color:var(--ch);font-weight:600}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#st{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--c2);border:1px solid var(--bd);border-radius:99px;padding:8px 16px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none}
@media print{button,.h{display:none}}
</style></head><body><main>
<div id="app"></div></main><div id="st"></div>
<script>
const SH=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],FL=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const FK=['F','Bb','Eb','Ab','Db','Gb','Dm','Gm','Cm','Fm','Bbm','Ebm'],KEYS=[];SH.forEach(k=>{KEYS.push(k,k+'m')});
const idx=n=>{let i=SH.indexOf(n);return i<0?FL.indexOf(n):i};
const CH=/^([A-G][#b]?)((?:m|maj|min|sus|add|dim|aug|M|[0-9]|[+\-()])*)(?:\/([A-G][#b]?))?$/;
const isCh=l=>{const t=l.trim().split(/\s+/).filter(Boolean);return t.length&&t.every(w=>CH.test(w))};
function tr(text,s,flat){const N=flat?FL:SH;return text.split('\n').map(l=>!isCh(l)?l:l.replace(/\S+/g,w=>{const m=w.match(CH);
  return N[(idx(m[1])+s)%12]+m[2]+(m[3]?'/'+N[(idx(m[3])+s)%12]:'')})).join('\n')}
const E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S=[],H=['Сетліст',''],view=null,editTxt=false,TOKEN='',R='';
try{TOKEN=localStorage.getItem('gh_token')||''}catch(e){}
function repo(){const h=location.hostname;if(h.endsWith('.github.io'))return h.split('.')[0]+'/'+(location.pathname.split('/')[1]||'');
  try{return localStorage.getItem('gh_repo')||''}catch(e){return ''}}
const stEl=()=>document.getElementById('st');
function setSt(t){const s=stEl();s.textContent=t;s.style.opacity=t?1:0;if(t.includes('✓'))setTimeout(()=>{s.style.opacity=0},1800)}
let timer,chain=Promise.resolve();
function save(){if(!TOKEN)return;setSt('Збереження…');clearTimeout(timer);
  timer=setTimeout(()=>{chain=chain.then(push).then(()=>setSt('Збережено ✓'),e=>setSt('Помилка збереження: '+e.message))},700)}
async function push(){const url=`https://api.github.com/repos/${R}/contents/data.json`,h={Authorization:'Bearer '+TOKEN,Accept:'application/vnd.github+json'};
  const g=await fetch(url+'?t='+Date.now(),{headers:h});const sha=g.ok?(await g.json()).sha:undefined;
  const content=btoa(unescape(encodeURIComponent(JSON.stringify({title:H[0],date:H[1],songs:S},null,1))));
  const p=await fetch(url,{method:'PUT',headers:h,body:JSON.stringify({message:'Оновлення сетліста',content,sha})});
  if(!p.ok)throw new Error(p.status)}
async function load(){let d=null;
  try{if(TOKEN&&R){const r=await fetch(`https://api.github.com/repos/${R}/contents/data.json?t=${Date.now()}`,{headers:{Authorization:'Bearer '+TOKEN,Accept:'application/vnd.github.raw+json'}});if(r.ok)d=await r.json()}}catch(e){}
  if(!d)try{d=await (await fetch('data.json?t='+Date.now())).json()}catch(e){}
  if(d){S=d.songs||[];H=[d.title||H[0],d.date||'']}}
async function login(){if(TOKEN){TOKEN='';try{localStorage.removeItem('gh_token')}catch(e){}return home()}
  R=repo();if(!R){R=prompt('Репозиторій у форматі логін/назва (наприклад ivan/setlist):')||'';if(!R)return}
  const t=(prompt('Встав токен GitHub (його бачиш тільки ти):')||'').trim();if(!t)return;
  try{const r=await fetch('https://api.github.com/repos/'+R,{headers:{Authorization:'Bearer '+t}});const j=await r.json();
    if(!r.ok||!j.permissions||!j.permissions.push)return alert('Токен не підходить до цього репозиторію або не має права запису.');
    TOKEN=t;try{localStorage.setItem('gh_token',t);localStorage.setItem('gh_repo',R)}catch(e){}await load();home()}
  catch(e){alert('Не вдалося перевірити токен.')}}
const $=id=>document.getElementById(id);
function home(){view=null;$('app').innerHTML=`<div class="eyebrow">Сетліст</div>
<input class="t" id="title" value="${E(H[0])}" ${TOKEN?'':'readonly'}><input class="t" id="date" value="${E(H[1])}" ${TOKEN?'':'readonly'}>
<div class="bar"><span>${S.length} пісень · ~${Math.round(S.length*4.5)} хв${TOKEN?' · тримай ⠿ і перетягуй':''}</span>${TOKEN?'<button class="p" onclick="add()">+ Пісня</button>':''}</div>
<div id="list">${S.map((s,i)=>`<div class="song" data-id="${s.id}">${TOKEN?'<span class="h">⠿</span>':'<span style="width:8px"></span>'}<span class="n">${i+1}</span>
<div class="sb" onclick="go(${s.id})"><div class="sn">${E(s.name)}</div></div><span class="pill k">${s.key}</span><span class="pill">${s.bpm}</span></div>`).join('')||'<p style="color:var(--mu)">Додай першу пісню</p>'}</div>
<div style="margin-top:18px;display:flex;gap:8px"><button onclick="cp()">Скопіювати</button><button onclick="print()">Друк</button><button onclick="login()" style="margin-left:auto;opacity:.7">${TOKEN?'Вийти':'Увійти'}</button></div>`;
  $('title').oninput=e=>{H[0]=e.target.value;save()};$('date').oninput=e=>{H[1]=e.target.value;save()};
  document.querySelectorAll('.h').forEach(h=>h.onpointerdown=dragStart)}
function dragStart(e){e.preventDefault();const card=e.target.closest('.song'),items=[...$('list').children],from=items.indexOf(card),
  step=card.offsetHeight+8,y0=e.clientY,s0=scrollY;let y=y0,to=from,raf;
  card.classList.add('drag');try{e.target.setPointerCapture(e.pointerId)}catch(_){}
  const upd=()=>{const dy=y-y0+scrollY-s0;card.style.transform=`translateY(${dy}px) scale(1.03)`;
    to=Math.max(0,Math.min(items.length-1,Math.round(from+dy/step)));
    items.forEach((c,i)=>{if(c!==card)c.style.transform=from<i&&i<=to?`translateY(${-step}px)`:to<=i&&i<from?`translateY(${step}px)`:''})};
  const loop=()=>{if(y<90)scrollBy(0,-10);else if(y>innerHeight-90)scrollBy(0,10);upd();raf=requestAnimationFrame(loop)};
  const mv=ev=>{y=ev.clientY};
  const up=()=>{cancelAnimationFrame(raf);removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);
    card.classList.remove('drag');card.style.transform=`translateY(${(to-from)*step}px)`;
    setTimeout(()=>{const o=S.splice(from,1)[0];S.splice(to,0,o);save();home()},260)};
  addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up);loop()}
function add(){if(!TOKEN)return;const s={id:Date.now(),name:'',key:'C',bpm:80,txt:''};S.push(s);save();editTxt=true;go(s.id)}
function go(id){view=id;const s=S.find(x=>x.id==id);
  $('app').innerHTML=`<button class="back" onclick="home()">← Сетліст</button>
<input class="t" id="nm" style="font-size:26px;font-weight:800" placeholder="Назва пісні" value="${E(s.name)}" ${TOKEN?'':'readonly'}>
${TOKEN?`<div class="g box"><div><label>Тональність</label><div class="r"><button class="step" onclick="tp(${id},-1)">−</button>
<select id="ky" onchange="tk(${id},this.value)">${KEYS.map(k=>`<option ${k==s.key?'selected':''}>${k}</option>`).join('')}</select><button class="step" onclick="tp(${id},1)">+</button></div></div>
<div><label>Темп, BPM</label><div class="r"><button class="step" onclick="bp(${id},-1)">−</button><span class="big" style="font-size:28px;min-width:50px">${s.bpm}</span><button class="step" onclick="bp(${id},1)">+</button></div></div></div>`:`<div class="box r" style="gap:16px"><span class="pill k" style="font-size:20px">${s.key}</span><span class="pill" style="font-size:20px">${s.bpm} BPM</span></div>`}
<div class="box"><div class="r" style="justify-content:space-between;margin-bottom:10px"><label style="margin:0">Акорди й текст</label>
${TOKEN?`<button onclick="editTxt=!editTxt;go(${id})">${editTxt?'Готово':'Редагувати'}</button>`:''}</div>
${TOKEN&&editTxt?`<textarea id="tx" placeholder="Акорди пиши окремим рядком над текстом">${E(s.txt)}</textarea>`:
`<pre>${s.txt.split('\n').map(l=>isCh(l)?'<span class="ch">'+E(l)+'</span>':E(l)).join('\n')||'<span style="color:var(--mu)">Порожньо</span>'}</pre>`}</div>
${TOKEN?`<button class="x" style="margin-top:14px" onclick="del(${id})">Видалити пісню</button>`:''}`;
  if(TOKEN)$('nm').oninput=e=>{s.name=e.target.value;save()};if($('tx'))$('tx').oninput=e=>{s.txt=e.target.value;save()}}
function tk(id,k){const s=S.find(x=>x.id==id);s.txt=tr(s.txt,((idx(k.replace('m',''))-idx(s.key.replace('m','')))%12+12)%12,FK.includes(k));s.key=k;save();go(id)}
function tp(id,d){const s=S.find(x=>x.id==id),m=s.key.endsWith('m'),n=((idx(s.key.replace('m',''))+d)%12+12)%12;
  tk(id,(FK.includes(s.key)||d<0?FL:SH)[n]+(m?'m':''))}
function bp(id,d){const s=S.find(x=>x.id==id);s.bpm=Math.max(40,Math.min(220,s.bpm+d));save();go(id)}
function del(id){if(confirm('Видалити пісню?')){S=S.filter(x=>x.id!=id);save();home()}}
function cp(){const t=H[0]+'\n'+S.map((s,i)=>`${i+1}. ${s.name} — ${s.key}, ${s.bpm} BPM`).join('\n');
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>alert('Скопійовано'),()=>prompt('Скопіюй:',t))}
load().then(home);
</script></body></html>
