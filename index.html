function tp(d){const s=mk(CX.song,CX.item),n=((kIdx(s.key)+d)%12+12)%12;tk((s.key.endsWith('m')?MIN:MAJ)[n])}
function ta(){const s=mk(CX.song,CX.item);setI({acc:(s.acc||defAcc(s.key))==='b'?'#':'b'});go(false)}
const cl=v=>Math.max(30,Math.min(300,v));
function bp(d){setS({bpm:cl(Math.round((CX.song.bpm+d)*100)/100)});go(false)}
function bi(el){const v=parseB(el.value);if(v>=30&&v<=300)setS({bpm:Math.round(v*100)/100})}
function bc(el){const v=parseB(el.value);setS({bpm:cl(isNaN(v)?CX.song.bpm:Math.round(v*100)/100)});el.value=fmtB(CX.song.bpm)}
function ld(){const m=parseInt($('lm').value,10),c=parseInt($('ls').value,10);setS({length_sec:(isNaN(m)&&isNaN(c))?null:Math.max(0,(m||0)*60+(c||0))||null})}
function lc(){ld();const s=CX.song;$('lm').value=s.len==null?'':Math.floor(s.len/60);$('ls').value=s.len==null?'':String(s.len%60).padStart(2,'0')}
function yc(el){const v=el.value.trim();if(!v)setS({youtube:null});else{const i=ytId(v);if(!i){alert('Не схоже на посилання YouTube');el.value=CX.song.yt?'https://youtu.be/'+CX.song.yt:'';return}setS({youtube:i})}go(false)}
async function rmItem(){if(!confirm('Прибрати пісню з цього сетліста? У бібліотеці вона залишиться.'))return;
  const r=await sb.from('setlist_items').delete().eq('id',CX.item.id);if(r.error)return fail(r.error);cur.items=cur.items.filter(i=>i.id!==CX.item.id);goUp()}
async function delSong(){const s=CX.song;if(!confirm('Видалити «'+(s.name||'без назви')+'» з бібліотеки та з усіх сетлістів?'))return;
  if(s.audio)await sb.storage.from('audio').remove([s.audio]);
  const r=await sb.from('songs').delete().eq('id',s.id);if(r.error)return fail(r.error);
  SONGS=SONGS.filter(x=>x.id!==s.id);SL.forEach(l=>{l.items=l.items.filter(i=>i.song_id!==s.id)});goUp()}
// ---------- режим «на сцені»
let WL=null;async function wake(on){try{if(on&&navigator.wakeLock&&!WL){WL=await navigator.wakeLock.request('screen');WL.onrelease=()=>{WL=null}}else if(!on&&WL){await WL.release();WL=null}}catch(e){}}
function stageView(st){view='stage';wake(true);const s=S[st.i];if(!s)return goUp();const g=isG(s.txt),nx=S[st.i+1],pv=S[st.i-1];
  $('app').innerHTML=`<div class="stg"><div class="sin"><div class="sbar"><button class="step" onclick="goUp()">✕</button><div class="stt"><b>${st.i+1}/${S.length}</b> &nbsp;${E(s.name)||'Без назви'}</div><button class="step" onclick="fz(-2)">A−</button><button class="step" onclick="fz(2)">A+</button></div>
<div class="r" style="margin:4px 0 12px;gap:8px;flex-wrap:wrap"><span class="pill k" style="font-size:18px">${kl(s.key,g)}</span><span class="pill" style="font-size:18px">${fmtB(s.bpm)} BPM</span>${hasLen(s)?`<span class="len">${fmtT(s.len)}</span>`:''}</div>
<div class="r" style="margin-bottom:14px">${segH()}</div>
<pre style="font-size:${fs}px">${viewText(show(s),vm).split('\n').map(l=>chordLine(l)?'<span class="ch">'+E(l)+'</span>':E(l)).join('\n')||'<span style="color:var(--mu)">Порожньо</span>'}</pre>
<div class="snav"><button class="step" style="width:56px" ${pv?'':'disabled'} onclick="stp(-1)">‹</button><button class="p" style="flex:1" ${nx?'':'disabled'} onclick="stp(1)">${nx?'Далі: '+E(nx.name)+' ›':'Остання пісня'}</button></div></div></div>`;
  let tx=0,ty=0;const a=$('app');a.ontouchstart=e=>{tx=e.changedTouches[0].clientX;ty=e.changedTouches[0].clientY};
  a.ontouchend=e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5)stp(dx<0?1:-1)}}
function stp(d){const i=ST.i+d;if(i<0||i>=S.length)return;const n={v:'stage',sl:ST.sl,i,d:ST.d};history.replaceState(n,'');render(n)}
function fz(d){fs=Math.max(12,Math.min(40,fs+d));try{localStorage.setItem('fs',fs)}catch(e){}const p=document.querySelector('pre');if(p)p.style.fontSize=fs+'px'}
function setVm(v){vm=v;try{localStorage.setItem('vm',v)}catch(e){}rr()}
function setTab(k){TAB=k;rr()}
// ---------- навігація
function render(st,fresh=true){if(view==='stage'&&st.v!=='stage'){wake(false);$('app').ontouchstart=$('app').ontouchend=null}
  ST=st;if(st.v!=='song'){AU.pause();AUid=null;editTxt=false}
  $('app').className=fresh?'':'noanim';
  if(st.v==='menu')return menu();if(st.v==='lib')return libView();if(st.v==='team')return teamView();
  let l=null;if(st.sl){l=SL.find(x=>x.id===st.sl);if(!l){ST={v:'menu',d:0};return menu()}cur=l;S=rows(l)}
  if(st.v==='sl')return slView();if(st.v==='pick')return pickView();if(st.v==='stage')return stageView(st);
  const item=l?l.items.find(i=>i.id===st.item):null,song=songOf(st.song||(item&&item.song_id));
  if(!song){ST={v:'menu',d:0};return menu()}
  CX={song,item};go(fresh)}
const rr=()=>render(ST,false);
function nav(st){st.d=(ST.d||0)+1;history.pushState(st,'');render(st)}
function goUp(){if(history.state&&history.state.d>0)return history.back();
  const p=ST.v==='song'?(ST.sl?{v:'sl',sl:ST.sl,d:0}:{v:'lib',d:0}):(ST.v==='stage'||ST.v==='pick')?{v:'sl',sl:ST.sl,d:0}:{v:'menu',d:0};history.replaceState(p,'');render(p)}
addEventListener('popstate',e=>{if(ME&&ME.role!=='pending')render(e.state||{v:'menu',d:0})});
addEventListener('keydown',e=>{if(view!=='stage'||/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;if(e.key==='ArrowRight')stp(1);else if(e.key==='ArrowLeft')stp(-1);else if(e.key==='Escape')goUp()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&view==='stage')wake(true)});
sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'){const p=prompt('Введіть новий пароль:');if(p)sb.auth.updateUser({password:p}).then(r=>alert(r.error?r.error.message:'Пароль змінено'))}});
boot();
</script></body></html>
